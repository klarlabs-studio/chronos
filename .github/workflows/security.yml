name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly OSV refresh so newly-published CVEs surface even when the
    # repo is quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  nox-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so nox can scan past commits for secrets when
          # `-history` is enabled.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install nox
        env:
          NOX_VERSION: "1.30.1"
          # SHA-256 of nox_1.22.1_linux_amd64.tar.gz. Pinning the checksum
          # makes the download tamper-evident: if the release asset ever
          # changes under us, the verification fails closed and the gate
          # never runs an unexpected binary.
          NOX_SHA256: "e90114e9f37b038af6d2e7f603c5f40684d7a3120f4f377b8a5741aba1b031da"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nox.tar.gz \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          echo "${NOX_SHA256}  /tmp/nox.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nox.tar.gz -C /tmp
          sudo install -m 0755 /tmp/nox /usr/local/bin/nox
          nox version

      - name: Run nox scan
        run: |
          # SARIF for GitHub Code Scanning, JSON for the annotate step,
          # CycloneDX SBOM as a release artefact. The committed
          # .nox/vex.json provides explicit waivers with justification
          # for known findings; -fail-on-unwaived restricts the
          # non-zero exit to findings NOT covered by an OpenVEX
          # statement, so dependabot bumps that re-trigger a
          # VEX'd rule (e.g. IAC-013 on trusted publishers) no
          # longer block the PR. Update the VEX document (not the
          # baseline) when accepting new finding categories.
          # nox 1.7.0 auto-discovers the baseline at ./.nox/baseline.json;
          # the explicit -baseline flag was removed from `nox scan`.
          nox scan . \
            -format all \
            -output ./.nox/out \
            -vex ./.nox/vex.json \
            -fail-on-unwaived

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./.nox/out/results.sarif
          category: nox

      - name: Annotate PR with new findings
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `nox annotate` exits non-zero when there are no new findings
        # (gh api returns 422 on an empty annotation payload). That's
        # the success state for a clean PR; swallow it so the job
        # doesn't fail when there's nothing to comment about.
        run: |
          nox annotate \
            -input ./.nox/out/findings.json \
            -repo "${GITHUB_REPOSITORY}" \
            -pr "${{ github.event.pull_request.number }}" || true

      - name: Upload SBOM and findings as build artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-${{ github.sha }}
          path: ./.nox/out/
          retention-days: 30
