name: CI

# No paths-ignore. Skipping CI for documentation-only changes saves a few
# minutes and costs the ability to merge them at all: the jobs below are
# required contexts, a skipped workflow reports nothing rather than
# success, and branch protection then blocks the pull request forever with
# no failing check to point at. A changelog-only change sat BLOCKED with
# zero pending checks and no failures, which is a confusing state to
# debug.
#
# Running the full suite on a prose change is wasteful. It is less
# wasteful than a documentation change that cannot be merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Install coverctl
        if: matrix.go-version == '1.25'
        run: go install go.klarlabs.de/coverctl@v1.17.0

      - name: Enforce coverage policy
        if: matrix.go-version == '1.25'
        run: coverctl check --profile ./coverage.out --from-profile -o json
        # `coverctl check` exits 1 on any domain falling below its
        # threshold in .coverctl.yaml. Tighten thresholds with
        # `coverctl suggest --strategy current --apply` after coverage
        # rises; loosening them is a code review concern.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: make build

      - name: Verify binary metadata
        run: ./bin/chronos version

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Run postgres integration tests
        env:
          TEST_POSTGRES_DSN: postgres://chronos:chronos@localhost:5432/chronos?sslmode=disable
        run: go test -race -count=1 ./internal/store/postgres/...

  integration-mysql:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: chronos
          MARIADB_DATABASE: chronos
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Run mysql integration tests
        env:
          TEST_MYSQL_DSN: mysql://root:chronos@localhost:3306/
        run: go test -race -count=1 ./internal/store/mysql/...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.15"
          args: check
