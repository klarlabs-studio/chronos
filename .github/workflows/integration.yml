name: integration

# Joint smoke test stack (Refs #31). Stands up chronos + mnemos via
# docker compose, then runs the build-tag-gated test suite under
# test/integration/. Runs on:
#
#   - workflow_dispatch (manual trigger from the Actions tab)
#   - schedule (nightly, so version-skew bugs surface within 24h)
#   - repository_dispatch (the mnemos repo fires this when its main
#     advances; the chronos workflow re-tests against the new image)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC nightly
  repository_dispatch:
    types: [mnemos-main-advanced]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Boot stack
        run: docker compose -f test/integration/docker-compose.yml up -d --wait

      # mnemos is secure by default: every /v1 request needs a bearer
      # token, reads included, and there is no anonymous mode. Mint one
      # against the running stack rather than baking a fixture token in
      # -- the signing key is generated per stack, so a committed token
      # could never verify.
      #
      # Least privilege on purpose: `user create` with no --scope grants
      # the "*" wildcard by schema default. This suite only appends
      # episodes, so it gets events:write and nothing else -- a token
      # that leaks from a CI log cannot be used to read the brain.
      - name: Mint mnemos token
        run: |
          set -euo pipefail
          compose() { docker compose -f test/integration/docker-compose.yml exec -T mnemos "$@"; }
          user_id=$(compose mnemos user create \
            --name smoke --email smoke@integration.local --scope events:write \
            | sed -n 's/^user_id=\([^ ]*\).*/\1/p')
          if [ -z "$user_id" ]; then
            echo "could not parse user_id from 'mnemos user create' output" >&2
            exit 1
          fi
          token=$(compose mnemos token issue --user "$user_id" --ttl 1h | tail -1 | tr -d '\r')
          if [ -z "$token" ]; then
            echo "could not parse token from 'mnemos token issue' output" >&2
            exit 1
          fi
          # ::add-mask:: before ::set-env:: so the value is redacted in
          # every later log line, including a step that echoes its env.
          echo "::add-mask::$token"
          echo "MNEMOS_INTEGRATION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Smoke test
        env:
          CHRONOS_INTEGRATION_URL: http://127.0.0.1:7778
          MNEMOS_INTEGRATION_URL: http://127.0.0.1:7777
        run: go test -tags=integration -v -count=1 -timeout=2m ./test/integration/...

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v
