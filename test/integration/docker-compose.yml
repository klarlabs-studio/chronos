# Joint smoke-test stack for chronos + mnemos (Refs #31 / mnemos #46).
#
# Brings up both halves of the cognitive stack so a CI run — or a
# developer on a fresh checkout — can exercise the cross-talk flows
# the smoke test under this directory covers:
#
#   1. POST observation → chronos
#   2. POST claim     → mnemos
#   3. GET signals   ← chronos (verifies ingest + detect path)
#   4. GET claims    ← mnemos (verifies persistence + run_id filter)
#
# The two services run isolated against ephemeral sqlite files baked
# into per-service named volumes so a `docker compose down -v` returns
# the stack to a known-empty state.
#
# Image pull strategy: by default both services come from GHCR
# (released images). Set CHRONOS_IMAGE / MNEMOS_IMAGE in the
# environment to point at a local build when developing.

version: "3.9"

services:
  chronos:
    image: ${CHRONOS_IMAGE:-ghcr.io/klarlabs-studio/chronos:latest}
    container_name: chronos-integration
    # The runtime image is distroless:nonroot (uid 65532), but Docker
    # creates the named volume mount point (/data) owned by root:root.
    # The nonroot process therefore cannot create /data/chronos.db and
    # `serve` dies with "sqlite: ping: unable to open database file (14)"
    # (SQLITE_CANTOPEN). Run this ephemeral smoke container as root so it
    # can write the SQLite file into the root-owned volume.
    user: "0:0"
    ports:
      - "7778:7778"
    environment:
      CHRONOS_DB_DSN: "sqlite:///data/chronos.db"
      CHRONOS_HTTP_HOST: "0.0.0.0"
      CHRONOS_HTTP_PORT: "7778"
    command: ["serve"]
    volumes:
      - chronos-data:/data
    # Probe with the binary, not wget. The runtime image is
    # gcr.io/distroless/static:nonroot -- no shell, no wget, no curl --
    # which is exactly why `chronos health` exists and why the Dockerfile
    # already declares HEALTHCHECK ["/chronos", "health"]. Overriding
    # that with wget makes the container permanently unhealthy, so
    # `compose up --wait` fails with "dependency failed to start:
    # container chronos-integration is unhealthy" and the nightly job
    # never reaches the smoke test. It had been red for 12 consecutive
    # runs.
    healthcheck:
      test: ["CMD", "/chronos", "health"]
      interval: 2s
      timeout: 1s
      retries: 30

  mnemos:
    image: ${MNEMOS_IMAGE:-ghcr.io/klarlabs-studio/mnemos:latest}
    container_name: mnemos-integration
    # Same root-owned-named-volume constraint as chronos above: run the
    # ephemeral smoke container as root so it can write /data/mnemos.db.
    user: "0:0"
    ports:
      - "7777:7777"
    environment:
      MNEMOS_DB_URL: "sqlite:///data/mnemos.db"
      MNEMOS_HTTP_HOST: "0.0.0.0"
      MNEMOS_HTTP_PORT: "7777"
      # The smoke test authenticates with a token minted by the CLI
      # inside this container (see the workflow). Both `serve` and
      # `token issue` resolve the signing key through
      # auth.DefaultSecretPath, which honours MNEMOS_AUTH_DIR -- so
      # pinning it here is what guarantees the issuer and the verifier
      # read the same key.
      #
      # It happens to work without this: both processes fall back to
      # the same project-root/home path in this image. That agreement
      # is implicit and unowned, and a token signed with a key the
      # server never loaded fails as 401 "invalid or revoked token",
      # which looks like a bad token rather than a split key. Pin it.
      MNEMOS_AUTH_DIR: "/data"
    command: ["serve"]
    volumes:
      - mnemos-data:/data
    depends_on:
      chronos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7777/health"]
      interval: 2s
      timeout: 1s
      retries: 30

volumes:
  chronos-data:
  mnemos-data:
