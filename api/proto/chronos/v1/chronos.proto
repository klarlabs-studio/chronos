syntax = "proto3";

package chronos.v1;

option go_package = "github.com/felixgeelhaar/chronos/api/proto/chronos/v1;chronosv1";

import "google/protobuf/timestamp.proto";

// ChronosService is the gRPC transport for the Chronos perception engine.
// It mirrors the HTTP REST surface: ingest observations and query signals.
// The service is signals-only: no Title, Summary, Suggestion, or dismissal.
service ChronosService {
  // Ingest persists a single EntityState observation. Detection is not
  // triggered automatically; the scheduler or compute pipeline handles
  // detection separately. Unary — batch ingest is IngestBatch.
  rpc Ingest(IngestRequest) returns (IngestResponse);

  // IngestBatch persists many observations in one RPC. Validation is
  // all-or-nothing, matching POST /v1/ingest/batch.
  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchResponse);

  // ListSignals returns signals matching the provided filter.
  rpc ListSignals(ListSignalsRequest) returns (ListSignalsResponse);

  // GetSignal returns a single signal by ID.
  rpc GetSignal(GetSignalRequest) returns (Signal);

  // StreamSignals is the gRPC equivalent of GET /v1/signals/stream.
  // Requires the in-process detection scheduler. Returns Unimplemented
  // when streaming is not attached. Each frame is a StreamSignalsResponse
  // so the stream type is unique from GetSignal's Signal return
  // (RPC_REQUEST_RESPONSE_UNIQUE).
  rpc StreamSignals(StreamSignalsRequest) returns (stream StreamSignalsResponse);

  // ValidateConfig dry-runs a candidate env-var map, matching
  // POST /v1/config/validate. Does not mutate the running server.
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);

  // ExportFederation returns anonymized pattern statistics, matching
  // GET /v1/federation/export. Returns Unimplemented unless
  // CHRONOS_FEDERATION_ENABLED=true.
  rpc ExportFederation(ExportFederationRequest) returns (FederationExport);
}

// PatternType is the enum mirror of domain.PatternType.
enum PatternType {
  PATTERN_TYPE_UNSPECIFIED = 0;
  PATTERN_TYPE_RECURRENCE  = 1;
  PATTERN_TYPE_TREND       = 2;
  PATTERN_TYPE_SPIKE       = 3;
  PATTERN_TYPE_DROP        = 4;
  PATTERN_TYPE_STALL       = 5;
  PATTERN_TYPE_ANOMALY     = 6;
  PATTERN_TYPE_SEASONALITY = 7;
  PATTERN_TYPE_CORRELATION = 8;
  PATTERN_TYPE_CHANGE_POINT = 9;
  PATTERN_TYPE_OUTLIER_CLUSTER = 10;
  PATTERN_TYPE_CROSS_SCOPE_CORRELATION = 11;
  PATTERN_TYPE_OSCILLATION = 12;
  PATTERN_TYPE_DIVERGENCE = 13;
  PATTERN_TYPE_CONVERGENCE = 14;
}

// EntityState is a single observation of an entity at a point in time.
message EntityState {
  string id = 1;        // UUID
  string entity_id = 2; // UUID
  string scope_id = 3;  // UUID
  google.protobuf.Timestamp timestamp = 4;
  repeated double features = 5;
  repeated string labels = 6;
  map<string, string> meta = 7;
}

// Signal is a structured description of a detected pattern.
message Signal {
  string id = 1;         // UUID
  string scope_id = 2;   // UUID
  string series = 3;     // UUID — the entity the pattern was detected in
  PatternType pattern = 4;
  google.protobuf.Timestamp detected_at = 5;
  TimeWindow window = 6;
  double strength = 7;
  double confidence = 8;
  map<string, double> metrics = 9;
  repeated Evidence evidence = 10;
  // Optional detector-side context that lets downstream consumers
  // narrate WHY the signal fired without re-deriving the data. Empty
  // when the detector did not surface one.
  Explanation explanation = 11;
  // Qualitative grade the detector assigned ("tentative" |
  // "established" | "strong") based on sample size vs MIN_POINTS.
  // Empty when the detector did not classify; consumers treat absent
  // as "no claim about strength".
  string confidence_class = 12;
}

// FeatureSample is one observation in the feature-evolution series the
// detector inspected.
message FeatureSample {
  google.protobuf.Timestamp at = 1;
  double value = 2;
}

// Explanation carries the detector-side context that produced a Signal:
// the feature evolution it saw, the peer cohort it compared against,
// the baseline window length, the threshold it crossed, and a stable
// version string for the detector. All fields are optional.
message Explanation {
  repeated FeatureSample feature_evolution = 1;
  int32 comparable_peers = 2;
  int32 baseline_window_days = 3;
  double threshold_used = 4;
  string detector_version = 5;
}

// TimeWindow describes the analysis window over which a signal was detected.
message TimeWindow {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// Evidence is one piece of supporting data backing a signal.
message Evidence {
  string series = 1;  // UUID
  google.protobuf.Timestamp time = 2;
  string kind = 3;
  double score = 4;
  map<string, double> metrics = 5;
}

// IngestRequest is the wire shape for the Ingest RPC.
message IngestRequest {
  string id = 1;        // UUID; optional, server generates if empty
  string entity_id = 2; // UUID
  string scope_id = 3;  // UUID
  google.protobuf.Timestamp timestamp = 4; // optional, server sets to now if not present
  repeated double features = 5;
  repeated string labels = 6;
  map<string, string> meta = 7;
  string adapter = 8; // source label; defaults to "grpc"
}

// IngestResponse confirms persistence.
message IngestResponse {
  string id = 1;
  string status = 2;
}

// ListSignalsRequest filters the signals store.
message ListSignalsRequest {
  string scope_id = 1;  // UUID; required unless scope_ids is set
  string series = 2;    // UUID; optional
  PatternType pattern = 3; // optional
  google.protobuf.Timestamp since = 4; // optional
  google.protobuf.Timestamp until = 5; // optional
  double min_confidence = 6; // optional
  int32 limit = 7;           // 0 = no limit
  // scope_ids: server-side allowlist for multi-scope queries. Use when
  // fetching across N entities owned by one consumer to avoid the N+1
  // round-trip pattern. At least one of scope_id or scope_ids must be
  // set.
  repeated string scope_ids = 8;
  // Opaque pagination token from a previous ListSignalsResponse.next_cursor.
  // Same encoding as HTTP ?since_cursor=.
  string since_cursor = 9;
}

// ListSignalsResponse carries the matched signals.
message ListSignalsResponse {
  repeated Signal signals = 1;
  int32 count = 2;
  // Opaque token for the next poll. Empty when the page is empty.
  string next_cursor = 3;
}

// IngestBatchRequest is the wire shape for IngestBatch.
message IngestBatchRequest {
  repeated IngestRequest observations = 1;
  bool defer_detection = 2;
}

// IngestBatchResponse confirms how many observations were persisted.
message IngestBatchResponse {
  int32 accepted = 1;
  bool defer_detection = 2;
}

// StreamSignalsRequest filters the live signal stream. At least one of
// scope_id or scope_ids is required, matching HTTP /v1/signals/stream.
message StreamSignalsRequest {
  string scope_id = 1;
  repeated string scope_ids = 2;
  PatternType pattern = 3;
}

// StreamSignalsResponse is one frame on the live signal stream.
message StreamSignalsResponse {
  Signal signal = 1;
}

// ValidateConfigRequest carries candidate CHRONOS_* env vars.
message ValidateConfigRequest {
  map<string, string> env = 1;
}

// DetectorReport is the dry-run verdict for one detector.
message DetectorReport {
  string name = 1;
  bool enabled = 2;
  string reason = 3;
  map<string, string> thresholds = 4;
  repeated string warnings = 5;
}

// ValidateConfigResponse lists one report per detector.
message ValidateConfigResponse {
  repeated DetectorReport detectors = 1;
}

// ExportFederationRequest is empty; the export is unscoped by design.
message ExportFederationRequest {}

// FederationPatternStats summarises one pattern type's signal population.
message FederationPatternStats {
  string pattern = 1;
  int32 count = 2;
  double avg_strength = 3;
  double min_strength = 4;
  double max_strength = 5;
  double avg_confidence = 6;
  double min_confidence = 7;
  double max_confidence = 8;
  double avg_sample_size = 9;
  int32 tentative_count = 10;
  int32 established_count = 11;
  int32 strong_count = 12;
}

// FederationExport is the anonymized pattern-statistics payload.
message FederationExport {
  google.protobuf.Timestamp generated_at = 1;
  string source = 2;
  string version = 3;
  repeated FederationPatternStats patterns = 4;
  int32 total_signals = 5;
}

// GetSignalRequest looks up a single signal.
message GetSignalRequest {
  string id = 1; // UUID
}
